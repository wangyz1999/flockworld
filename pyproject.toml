[project]
name = "flockworld"
version = "0.1.0"
description = "JAX-based boid flocking Gymnasium environment for video world-model research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.2.3",
    "jax[cuda12]>=0.10.0",
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "opencv-python>=4.13.0.92",
    "polars>=1.40.1",
    "pynvvideocodec>=2.0.2",
    "rich>=14.3.3",
    "torchvision>=0.27.0",
    "absl-py>=2.0.0",
    "decord>=0.6.0",
    "dm-pix>=0.4.4",
    "einops>=0.8.0",
    "hydra-core>=1.3.2",
    "optax>=0.2.5",
    "orbax-checkpoint>=0.11.0",
    "pyarrow>=15.0.0",
    "scipy>=1.13.0",
    "tqdm>=4.66.0",
    "wandb>=0.17.0",
    "lightning>=2.6.4",
]

[tool.setuptools.packages.find]
include = ["flockworld*", "modeling*"]
