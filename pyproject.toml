[project]
name = "flockworld"
version = "0.1.0"
description = "JAX-based boid flocking Gymnasium environment for video world-model research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.2.3",
    "jax[cuda12]>=0.10.0",
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "opencv-python>=4.13.0.92",
    "polars>=1.40.1",
    "rich>=14.3.3",
    "torchvision>=0.27.0",
    "einops>=0.8.0",
    "scipy>=1.13.0",
    "wandb>=0.17.0",
    "lightning>=2.6.4",
    "torch>=2.12.0",
    "torchcodec>=0.11.0",
]

[tool.setuptools.packages.find]
include = ["flockworld*", "modeling*"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchcodec = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

# CUDA Toolkit 13.0 → PyTorch cu130 wheels (torch, torchvision, torchcodec).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
