[project]
name = "flockworld"
version = "0.1.0"
description = "JAX-based boid flocking Gymnasium environment for video world-model research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.2.3",
    "jax[cuda12]>=0.10.0",
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "opencv-python>=4.13.0.92",
    "rich>=14.3.3",
]

[tool.setuptools.packages.find]
include = ["flockworld*"]
