seed: 42
output_dir: output/train_vae           # run dir = {output_dir}/{YYYYMMDD-HHMMSS}_{experiment_name}
experiment_name: wan_vae_color_stream

data:
  root: null                  # unused: streaming generates clips from the sim.
  val_fraction: 0.1
  num_frames: 17              # Must be 1 + 4k for WanVAE chunking.
  frame_stride: 1
  image_size: [128, 128]
  partial_agent_indices: null
  overfit_n: null
  streaming:
    enabled: true
    sim_config: config/data_recording.yaml
    sim_overrides:            # black background + per-agent hue (matches the 20260630 recording).
      - rendering.color_mode=agent_id
      - rendering.background_gradient=false
    num_partial_agents: 10
    windows_per_episode: 6
    warmup_steps: 60
    clips_per_epoch: 4096     # 128 steps/epoch at batch_size 32 -> val + ckpt every 128 steps.
    val_clips: 64
    threads_per_worker: 2

dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true

model:
  dim: 32
  dec_dim: 32
  z_dim: 8
  dim_mult: [1, 2, 4, 4]
  num_res_blocks: 2
  attn_scales: []
  temperal_downsample: [false, true, true]
  dropout: 0.0
  patch_size: 2
  # Warm start from the non-streaming black-background color-agent run (epoch 81,
  # val/loss 0.0042). Weights only -- fresh optimizer and epoch counter.
  pretrained_path: output/train_vae/20260630-221546_wan_vae_color_agent_id_no_gradient/checkpoints/vae-081-0.0042.ckpt

loss:
  recon_loss: l1
  kl_weight: 1.0e-6
  logvar_clamp: [-30.0, 20.0]

optim:
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 1.0e-6
  scheduler: cosine       # decay over the full run; constant 1e-4 drifted upward late in the gradient_stream run.
  t_max: 524800           # total steps = max_epochs * (clips_per_epoch / batch_size) = 4100 * 128.
  eta_min: 1.0e-6

trainer:
  max_epochs: 4100            # ~1 week: measured 145 s/epoch (128 steps @ 0.91 it/s + val) on the 4090.
  accelerator: auto
  devices: auto
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 20
  val_check_interval: 1.0
  limit_val_batches: 1.0
  deterministic: false
  summary_depth: 2
  print_torchinfo: false
  torchinfo_depth: 2

checkpoint:
  monitor: val/loss
  mode: min
  save_top_k: 5              # rolling best-5 by val/loss, re-evaluated every epoch (~2 min).
  save_last: true             # last.ckpt -> resume point for `--resume`.
  every_n_epochs: 1
  periodic_every_n_epochs: 200  # snap-*.ckpt milestones kept forever (~176 MB each).

logger:
  use_wandb: true
  wandb_project: flockworld-vae
  wandb_entity: null
  log_video_every_n_steps: 800
  log_video_to_wandb: true
  video_fps: 8
  video_codec: avc1
