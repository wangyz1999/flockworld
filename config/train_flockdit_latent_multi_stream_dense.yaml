seed: 42
device: auto
output_dir: output/flock_dit_multi_stream_dense
experiment_name: flock_dit_multi_stream_dense

# Experiment 5 (density): identical to the streaming vanilla baseline
# (train_flockdit_latent_multi_stream.yaml) except the sim_overrides below --
# the world shrinks 720x720 -> 360x360 and the flock shrinks 100 -> 25 boids,
# which conserves boids-per-px^2 exactly (100/720^2 = 25/360^2) so per-view
# white-boid clutter and local flocking stay baseline-like; the 10 colored
# camera agents stay fixed, so THEIR density quadruples and each 128px view
# covers 12.6% of the world instead of 3.2%. Measured effect (200-step
# episodes, 3 seeds): mean covisible colored agents/view 0.34 -> 1.70, views
# with >=1 covisible 31% -> 79%, >=2 3% -> 54%, white boids/view 3.7 -> 2.3.
# Tests whether cross-view consistency fails in the baseline because covisible
# pairs are too rare to learn from. Model/arch untouched; no code changes
# (sim_overrides accept any dotted sim key). Values chosen 2026-07-14 with the
# user: 360 canvas, density-matched 25 boids (clutter was the concern with
# keeping 100).

data:
  latent: true                    # world model trains in latent space (encoded on the fly)
  num_context_frames: 2
  num_future_frames: 4
  num_agents: 10
  action_features:
    - acc_x
    - acc_y
  random_clip: true
  streaming:
    enabled: true
    sim_config: config/data_recording.yaml
    sim_overrides:
      - rendering.color_mode=agent_id
      - rendering.background_gradient=false
      # -- experiment 5: density -------------------------------------------- #
      - canvas.width=360
      - canvas.height=360
      - boids.num_agents=25
    num_frames: 21                # -> L = 1 + (21-1)//4 = 6 latent frames = context + future
    frame_stride: 1
    windows_per_episode: 4        # windows cut from each simulated episode (amortizes warmup)
    warmup_steps: 60
    clips_per_epoch: 2000         # train windows per "epoch"
    val_windows: 64               # fixed streamed validation set
    threads: 2                    # JAX CPU threads per dataloader worker
    stats_batches: 8              # batches used once at startup to measure latent mean/std

vae:
  checkpoint_path: pretrained/color_agent/checkpoint2/vae-081-0.0042.ckpt
  encode_image_size: [128, 128]

dataloader:
  batch_size: 4
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  drop_last: true

model:
  in_channels: 8
  out_channels: 8
  patch: 1
  patch_t: 1
  dim: 512
  depth: 8
  heads: 8
  ffn_dim: 2048
  local_attn_size: -1

optim:
  lr: 0.0002
  weight_decay: 0.000001

train:
  epochs: 100
  log_every: 20
  save_every: 1
  save_every_steps: 1000          # mid-epoch step_*.pt checkpoints (0 = off)
  keep_step_checkpoints: 5        # rotate, keep newest N (0 = keep all)
  grad_clip_norm: 1.0
  amp: true

logger:
  use_wandb: true
  wandb_project: flock-world-model
  wandb_entity: null
  log_sample_every: 0
  sample_steps: 50
  video_fps: 8
